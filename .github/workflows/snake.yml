name: page

on:
  schedule:
    # 每天 03:20 UTC 重新合成一次
    - cron: "20 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Lazyeeeeeeee
          outputs: |
            dist/snake.svg?color_snake=%23FFB3D1&color_dots=%23171026,%23241738,%233A2470,%236C3BFF,%23C7B2FF

      - name: Compose the starfield page
        run: node tools/build-page.mjs dist/snake.svg dist/page.svg

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
